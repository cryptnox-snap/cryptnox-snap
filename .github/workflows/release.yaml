name: Build and Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (for example 1.0.4)'
        required: true
        type: string
      snap_channel:
        description: 'Snap Store channel'
        required: true
        default: edge
        type: choice
        options:
          - edge
          - beta
          - stable

permissions:
  contents: write

env:
  SNAP_CHANNEL: ${{ inputs.snap_channel || 'stable' }}

jobs:
  build-deb:
    name: Build Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dh-python python3-all python3-setuptools \
            python3-pip python3-venv pybuild-plugin-pyproject swig libpcsclite-dev \
            pcscd devscripts fakeroot build-essential
      - name: Build Debian package
        env:
          PYTHON_BIN: python3.12
          SKIP_DEPS: 'true'
          BUILD_DIR: ${{ runner.temp }}/cryptnox-deb-build
        run: ./scripts/build-deb.sh "${{ steps.version.outputs.version }}"
      - name: Collect Debian artifacts
        run: |
          mkdir -p release-assets
          find "${RUNNER_TEMP}/cryptnox-deb-build" -type f -name '*.deb' -exec cp {} release-assets/ \;
          find "${RUNNER_TEMP}/cryptnox-deb-build" -type f -name '*.changes' -exec cp {} release-assets/ \; || true
          test -n "$(find release-assets -type f -name '*.deb' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: release-assets/*

  build-snap:
    name: Build Snap (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Snap
        id: build
        uses: snapcore/action-build@v1
        with:
          snapcraft-channel: latest/stable
      - uses: actions/upload-artifact@v4
        with:
          name: snap-package
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-deb, build-snap]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Cryptnox ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
          prerelease: ${{ env.SNAP_CHANNEL != 'stable' }}

  publish-snap:
    name: Publish Snap to Store
    needs: [build-snap, release]
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    runs-on: ubuntu-latest
    steps:
      - name: Store credentials not configured
        if: ${{ env.SNAPCRAFT_STORE_CREDENTIALS == '' }}
        run: echo "SNAPCRAFT_STORE_CREDENTIALS is not configured; skipping Snap Store upload."
      - uses: actions/download-artifact@v4
        if: ${{ env.SNAPCRAFT_STORE_CREDENTIALS != '' }}
        with:
          name: snap-package
          path: snap-artifact
      - name: Publish Snap
        if: ${{ env.SNAPCRAFT_STORE_CREDENTIALS != '' }}
        uses: snapcore/action-publish@v1
        with:
          snap: snap-artifact/*.snap
          release: ${{ env.SNAP_CHANNEL }}
          snapcraft-credentials: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
